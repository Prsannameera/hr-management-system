<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leave')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('leave')}"></aside>
    <main class="main">
        <section th:replace="~{fragments/layout :: topbar('Leave Management')}"></section>

        <p class="flash" th:if="${message}" th:text="${message}"></p>

        <section class="split-layout">
            <article class="panel">
                <div class="panel-header">
                    <div>
                        <h2>New Leave Request</h2>
                        <p>Submit leave for approval.</p>
                    </div>
                </div>
                <form class="form-grid" th:action="@{/leave}" method="post">
                    <label>Employee
                        <select name="employeeId" required>
                            <option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.name + ' - ' + employee.department}"></option>
                        </select>
                    </label>
                    <label>Leave Type
                        <select name="leaveType">
                            <option>Casual Leave</option>
                            <option>Medical Leave</option>
                            <option>Earned Leave</option>
                            <option>Work From Home</option>
                        </select>
                    </label>
                    <label>Start Date<input type="date" name="startDate" required></label>
                    <label>End Date<input type="date" name="endDate" required></label>
                    <label>Reason<input name="reason" required></label>
                    <button class="primary-action full" type="submit">Submit Request</button>
                </form>
            </article>

            <article class="panel">
                <div class="panel-header">
                    <div>
                        <h2>Leave Requests</h2>
                        <p>Approve or reject pending requests.</p>
                    </div>
                </div>
                <div class="request-list">
                    <div class="request-row" th:each="request : ${leaveRequests}">
                        <div>
                            <strong th:text="${request.employeeName}">Employee</strong>
                            <span th:text="${request.leaveType + ' | ' + request.startDate + ' to ' + request.endDate}">Leave dates</span>
                            <small th:text="${request.reason}">Reason</small>
                        </div>
                        <span class="status" th:classappend="${request.status == 'Approved'} ? ' good' : (${request.status == 'Rejected'} ? ' bad' : ' warn')" th:text="${request.status}">Pending</span>
                        <form th:if="${request.status == 'Pending'}" th:action="@{/leave/{id}/approve(id=${request.id})}" method="post">
                            <button type="submit">Approve</button>
                        </form>
                        <form th:if="${request.status == 'Pending'}" th:action="@{/leave/{id}/reject(id=${request.id})}" method="post">
                            <button class="danger" type="submit">Reject</button>
                        </form>
                    </div>
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
